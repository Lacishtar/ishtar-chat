<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Lacishtar Chat</title>
    <!-- Google Fonts — cần thiết để overlay hiển thị đúng font trong OBS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Comfortaa:wght@400;700&family=Quicksand:wght@400;700&family=Nunito:wght@400;700&family=Grandstander:wght@400;700&family=Varela+Round&family=Mali:wght@400;700&family=Itim&family=Sriracha&family=Yomogi&family=M+PLUS+Rounded+1c:wght@400;700&family=Be+Vietnam+Pro:wght@400;700&family=Source+Sans+3:wght@400;700&family=Raleway:wght@400;700&family=Exo+2:wght@400;700&family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
    </style>
    <link rel="stylesheet" href="/overlay/base-layout.css" />
    <link rel="stylesheet" href="/overlay/layout-text.css" />
    <link rel="stylesheet" href="/overlay/slot-layout.css" />
    <link rel="stylesheet" href="/overlay/slot-visibility.css" />
    <link rel="stylesheet" href="/overlay/slot-animations.css" />
    <link rel="stylesheet" href="/overlay/slot-transforms.css" />
    <link rel="stylesheet" href="/overlay/slot-decorations.css" />
    <link rel="stylesheet" href="/overlay/decoration-layers.css" />
    <link rel="stylesheet" href="/overlay/role-styles.css" />
    <link rel="stylesheet" href="/overlay/bubble-frame.css" />
    <link rel="stylesheet" href="/overlay/bubble-wrap.css" />
    <link rel="stylesheet" href="/overlay/danmaku.css" />
    <link rel="stylesheet" href="/overlay/ticker.css" />
    <link rel="stylesheet" href="/overlay/idle-animations.css" />
  </head>
  <body>
    <div id="ovs-chat-list"></div>
    <template id="ovs-message-template">
      <div class="ovs-slot">
        <div class="ovs-idle">
          <div class="ovs-message">
            <img class="ovs-avatar" data-slot="avatar" alt="" />
            <div class="ovs-body">
              <div class="ovs-meta">
                <span class="ovs-author" data-slot="author"></span>
                <span class="ovs-badges" data-slot="badges"></span>
              </div>
              <div class="ovs-text" data-slot="message"></div>
            </div>
          </div>
        </div>
      </div>
    </template>
    <script>
      window.__OVS_INITIAL_STATE__ = /*OVS_INITIAL_STATE*/ {};
    </script>
    <script type="module" src="/overlay/overlay-client.js?v=8"></script>
  </body>
</html>
